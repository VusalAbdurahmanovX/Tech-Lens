<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Lens</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header><img class="brand-mark" src="icon.png" alt="" width="28" height="28"><strong>tech lens<span class="dot">.</span></strong><span class="edition">TECHNOLOGY DETECTOR</span></header>
  <main>
    <div class="target"><span class="status-dot" aria-hidden="true"></span><span id="site">Current tab</span><button id="scan" type="button" title="Scan the current tab">Scan ↗</button></div>
    <div class="section-heading"><h1>Technologies</h1><span id="count" aria-label="Number of matching technologies">0</span></div>
    <div class="toolbar"><label for="filter" class="sr-only">Search technologies</label><input id="filter" type="search" placeholder="Search technologies or categories" autocomplete="off"></div>
    <p id="status" role="status" aria-live="polite">Scanning this page…</p>
    <div id="results"></div>
    <p id="empty" hidden>No technologies match your search.</p>
  </main>
  <footer><span class="privacy">Your data stays on this device.</span><button id="copy" disabled type="button">Copy JSON</button></footer>
  <script type="module" src="panel.js"></script>
</body>
</html>
